[package]
name = "app"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
# Ties the spawned Python backend's lifetime to this process at the OS level
# (Windows Job Object, JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE) -- without this,
# force-killing app.exe (taskkill /F, a crash, Task Manager "End task")
# orphans the Python child, since Windows has no parent/child process-tree
# relationship on its own and no Rust cleanup code gets to run when the
# process is terminated externally. See backend.rs's BackendProcess::start().
win32job = "2"
