<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="rgb(249, 250, 251)" />
		<script>
			// Real globals, not Vite `define` text-substitutions -- see the
			// removed vite.config.ts workaround for why. SvelteKit's client
			// runtime reads several __SVELTEKIT_*__ identifiers as bare
			// top-level module-scope references during hydration
			// (sveltejs/kit#13249): upstream's own root-cause diagnosis is
			// that `define` doesn't reliably rewrite these for code
			// evaluated early in the dev-server's module graph, so they
			// intermittently stay undeclared and throw ReferenceError.
			// Confirmed live: fixing only __SVELTEKIT_PAYLOAD__ first just
			// meant __SVELTEKIT_PATHS_BASE__ crashed on the very next fresh
			// load instead -- this isn't one flaky identifier, it's the same
			// unreliable mechanism behind *every* global SvelteKit's own
			// Vite plugin tries to `define` in dev mode (see
			// @sveltejs/kit/src/exports/vite/index.js's `define` object,
			// which sets up exactly these keys automatically -- Orion's own
			// vite.config.ts never configured most of these itself).
			//
			// Declaring the real globals here, before any SvelteKit module
			// import executes, sidesteps the unreliable substitution
			// entirely: normal scope-chain lookup finds them on `window`
			// directly, no compile-time rewrite required. Values below are
			// SvelteKit's documented defaults for an unconfigured `kit.*`
			// section (confirmed against svelte.config.js, which sets
			// neither `paths`, `appDir`, `router`, nor `experimental` --
			// this app uses every default). __SVELTEKIT_PAYLOAD__ is `{}`
			// for a different reason: Orion runs with `ssr` disabled (see
			// src/routes/+layout.ts), so there's no real SSR payload to
			// hydrate -- an empty object is the actually-correct value,
			// not a placeholder.
			window.__SVELTEKIT_PAYLOAD__ = window.__SVELTEKIT_PAYLOAD__ || {};
			window.__SVELTEKIT_PATHS_BASE__ = window.__SVELTEKIT_PATHS_BASE__ ?? "";
			window.__SVELTEKIT_PATHS_ASSETS__ = window.__SVELTEKIT_PATHS_ASSETS__ ?? "";
			window.__SVELTEKIT_PATHS_RELATIVE__ = window.__SVELTEKIT_PATHS_RELATIVE__ ?? true;
			window.__SVELTEKIT_APP_DIR__ = window.__SVELTEKIT_APP_DIR__ ?? "_app";
			window.__SVELTEKIT_EMBEDDED__ = window.__SVELTEKIT_EMBEDDED__ ?? false;
			window.__SVELTEKIT_CLIENT_ROUTING__ = window.__SVELTEKIT_CLIENT_ROUTING__ ?? true;
			window.__SVELTEKIT_HASH_ROUTING__ = window.__SVELTEKIT_HASH_ROUTING__ ?? false;
			window.__SVELTEKIT_SERVER_TRACING_ENABLED__ = window.__SVELTEKIT_SERVER_TRACING_ENABLED__ ?? false;
			window.__SVELTEKIT_EXPERIMENTAL__REMOTE_FUNCTIONS__ =
				window.__SVELTEKIT_EXPERIMENTAL__REMOTE_FUNCTIONS__ ?? false;
			window.__SVELTEKIT_FORK_PRELOADS__ = window.__SVELTEKIT_FORK_PRELOADS__ ?? false;
		</script>
		<script>
			(function () {
				try {
					var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
					var stored = localStorage.getItem("theme");
					var followSystem = stored === null || stored === "system";
					var isDark = stored === "dark" || (followSystem && prefersDark);
					if (isDark) {
						document.documentElement.classList.add("dark");
						document.querySelector('meta[name="theme-color"]').setAttribute("content", "#07090d");
					}
				} catch (e) {}
			})();

			// For some reason, Sveltekit doesn't let us load env variables from .env here, so we load it from hooks.server.ts
			window.gaId = "%gaId%";
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full dark:bg-gray-900">
		<div id="app" class="contents h-full">%sveltekit.body%</div>

		<!-- Google Tag Manager -->
		<script>
			if (window.gaId) {
				const script = document.createElement("script");
				script.src = "https://www.googletagmanager.com/gtag/js?id=" + window.gaId;
				script.async = true;
				document.head.appendChild(script);

				window.dataLayer = window.dataLayer || [];
				function gtag() {
					dataLayer.push(arguments);
				}
				gtag("js", new Date());
				/// ^ See https://developers.google.com/tag-platform/gtagjs/install
				gtag("config", window.gaId);
				gtag("consent", "default", { ad_storage: "denied", analytics_storage: "denied" });
				/// ^ See https://developers.google.com/tag-platform/gtagjs/reference#consent
				/// TODO: ask the user for their consent and update this with gtag('consent', 'update')
			}
		</script>
	</body>
</html>
